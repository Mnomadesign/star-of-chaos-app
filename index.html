e:13px}.hour.on{background:#4a1834;border-color:var(--gold);color:#ffe4ac}.nav{position:fixed;bottom:0;left:0;right:0;background:#120b12ed;backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:8px max(8px,env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:5}.navinner{width:min(900px,100%);display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.nav button{border:0;background:transparent;color:var(--muted);padding:7px 2px;border-radius:12px;cursor:pointer;font-size:11px}.nav button b{display:block;font-size:19px;font-weight:500}.nav button.active{color:var(--gold);background:#26313a}.overlay{position:fixed;inset:0;background:#071019d9;z-index:10;display:none;align-items:flex-end;justify-content:center}.overlay.show{display:flex}.sheet{width:min(720px,100%);max-height:88vh;overflow:auto;background:#14212b;border:1px solid var(--line);border-radius:24px 24px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.menu-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.menu-card{padding:14px;border:1px solid var(--line);border-radius:15px;background:#1b2a35;text-align:left;cursor:pointer;color:var(--text)}.menu-card strong{display:block;margin:5px 0}.calendarHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.dow,.daycell{text-align:center;padding:8px 2px;font-size:12px}.dow{color:var(--muted)}.daycell{background:#100a10;border:1px solid transparent;border-radius:10px;min-height:40px;cursor:pointer;position:relative}.daycell.muted{opacity:.35}.daycell.sel{border-color:var(--gold);background:#403824}.daycell.today:after{content:"";position:absolute;bottom:4px;left:calc(50% - 3px);width:6px;height:6px;border-radius:50%;background:var(--teal)}.daycell.has:before{content:"";position:absolute;top:4px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--gold)}.section{margin-top:14px}.sep{height:1px;background:var(--line);margin:14px 0}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#f2bf5b;color:#18212a;padding:10px 15px;border-radius:12px;font-weight:700;z-index:20;box-shadow:0 5px 20px #0007;display:none}.toast.show{display:block}.ninja{display:flex;align-items:center;gap:12px}.homehero{background:linear-gradient(145deg,#263746,#1b2934);border-color:#a83972}.home-actions{display:flex;gap:7px;flex-wrap:wrap}.goal-input{display:flex;align-items:center;gap:4px;color:var(--muted)}.goal-input input{width:112px;padding:8px}.mini-days{display:grid;gap:5px}.mini-day{display:flex;justify-content:space-between;border-bottom:1px solid #2d3c48;padding:5px 0;font-size:13px}.mini-day span{color:var(--muted)}.linkbtn{border:0;background:none;color:var(--gold);text-decoration:underline;padding:0;cursor:pointer;font:inherit}.ninjaicon{width:66px;height:66px;flex:none}.ninjaicon svg{width:100%;height:100%}.fine{font-size:12px;color:var(--muted)}.stat{font-size:12px;color:var(--muted)}.eventline{border-left:3px solid var(--gold);padding:5px 0 5px 11px}.warning{border:1px solid #725e38;background:#342f24;border-radius:12px;padding:11px;color:#f3d9a1;font-size:13px}.hidden{display:none!important}@media(min-width:650px){.app{padding-top:26px}.quickHours{grid-template-columns:repeat(6,1fr)}.sheet{border-radius:24px;margin-bottom:20px}.overlay{align-items:center}.menu-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:390px){.app{padding-left:12px;padding-right:12px}.card{padding:13px}.big{font-size:25px}.page-title{font-size:23px}}

<script>
(()=>{'use strict';const KEY='star-of-chaos-v1',LEGACY_KEY='central-vida-v1';const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const iso=(d)=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const money=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(n)||0);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let db;try{db=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem(LEGACY_KEY)||'{}')}catch{db={}};db.days??={};db.projects??=[];db.payments??=[];db.events??=[];db.feed??=[];db.settings??={goal:200};let page='Hoje',calDate=today(),calMonth=new Date();function day(d=today()){db.days[d]??={hours:[],routine:{},health:{water:0,checks:{},sleep:'',energy:'',mood:''},work:{uber:'',ninenine:'',start:'',end:'',fuel:0,food:0,other:0},notes:''};let x=db.days[d];x.hours??=[];x.routine??={};x.health??={water:0,checks:{},sleep:'',energy:'',mood:''};x.health.checks??={};x.work??={uber:0,ninenine:0,start:'',end:'',fuel:0,food:0,other:0};return x}function save(){localStorage.setItem(KEY,JSON.stringify(db))}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}function totalXP(){let total=0;for(const x of Object.values(db.days)){total+=(x.hours?.length||0)*10;total+=Object.values(x.routine||{}).filter(Boolean).length*5;if(essentials.every(k=>x.routine?.[k]))total+=20;total+=Math.min(8,x.health?.water||0)*2;total+=Object.values(x.health?.checks||{}).filter(Boolean).length*3;for(const k of ['sleep','energy','mood'])if(x.health?.[k])total+=3}return total}function addXP(){}function xpLabel(){let xp=totalXP();return `NÍVEL ${Math.floor(xp/200)+1}<br>${xp%200}/200 XP`}function daysSorted(){return Object.keys(db.days).sort()}function baseIncome(x){let w=x.work||{},hasAppIncome=(w.uber!==''&&w.uber!=null)||(w.ninenine!==''&&w.ninenine!=null),apps=(+w.uber||0)+(+w.ninenine||0);return hasAppIncome?apps:(x.hours?.length||0)*50}function transactions(x){if(!Array.isArray(x.transactions))x.transactions=[];if(x.expenses&&Object.keys(x.expenses).length&&!x.legacyExpenseMigrated){for(const e of Object.values(x.expenses)){if(e&&typeof e==='object'&&Number(e.amount)>0)x.transactions.push({id:id(),label:e.name||'Gasto anterior',amount:-Math.abs(Number(e.amount)),created:new Date().toISOString()})}x.legacyExpenseMigrated=true}return x.transactions}function totalIncome(x){return baseIncome(x)+transactions(x).reduce((s,t)=>s+(+t.amount>0?+t.amount:0),0)}function totalExpense(x){return (+x.work?.fuel||0)+(+x.work?.food||0)+(+x.work?.other||0)+transactions(x).reduce((s,t)=>s+(+t.amount<0?Math.abs(+t.amount):0),0)}function net(x){return totalIncome(x)-totalExpense(x)}function totalHours(x){let t=0;if(x.work?.start&&x.work?.end){let [h,m]=x.work.start.split(':').map(Number),[eh,em]=x.work.end.split(':').map(Number),delta=eh*60+em-h*60-m;if(delta<0)delta+=24*60;t=Math.max(0,delta/60)}return t}const routine=[['water','Beber água','Essencial'],['meal','Fazer uma refeição','Essencial'],['hygiene','Higiene pessoal','Essencial'],['rest','Pausa ou descanso','Essencial'],['home','Organização rápida da casa','Opcional'],['bike','Preparar a moto','Essencial'],['start','Começar o trabalho ou definir o próximo passo','Essencial'],['money','Registrar o dinheiro do dia','Opcional'],['tomorrow','Preparar o próximo dia','Opcional']];const essentials=['water','meal','hygiene','rest','bike'];function nav(){let items=[['Hoje','⌂'],['Rotina','✓'],['Dinheiro','R$'],['Calendário','▦'],['Mais','☰']];document.getElementById('nav').innerHTML=items.map(([n,i])=>`<button data-nav="${n}" class="${(n===page||n==='Mais'&&['Saúde','Trabalho','Projetos','Pagamentos','Semana','Feed','Dados'].includes(page))?'active':''}"><b>${i}</b>${n}</button>`).join('')}function header(){return `<header class="top"><div class="brand"><div class="mark">◈</div><div><strong>Star of Chaos</strong><small>um passo possível de cada vez</small></div></div><div class="topRight"><div class="level">${xpLabel()}</div><button class="iconbtn" data-action="backup" title="Backup">↧</button></div></header>`}function title(t,desc=''){return `<h1 class="page-title">${t}</h1>${desc?`<p class="intro">${desc}</p>`:''}`}function actionButton(text,action,cl='secondary',attrs=''){return `<button type="button" class="btn ${cl}" data-action="${action}" ${attrs}>${text}</button>`}function ninja(){let recent=[];for(let i=2;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);let x=db.days[iso(d)];if(x)recent.push((Object.values(x.routine||{}).filter(Boolean).length)+(x.health?.water||0)+(x.hours?.length||0))}let avg=recent.length?recent.reduce((a,b)=>a+b,0)/recent.length:0;let mode=avg>=5?'presente':avg>=2?'retomando':'em pausa';let msg=mode==='presente'?'Boa. Mantém o ritmo sem se cobrar além do necessário.':mode==='retomando'?'Uma ação pequena já conta. Escolhe o próximo passo.':'Dia difícil também faz parte. Começa com dois minutos.';return `<div class="card ninja"><div class="ninjaicon"><svg viewBox="0 0 72 72" aria-label="Ninja da constância"><circle cx="36" cy="36" r="34" fill="#241323" stroke="#e8bd65" stroke-width="2"/><path d="M18 38c0-14 8-23 18-23s18 9 18 23v14H18z" fill="#281321" stroke="#ff5ca8" stroke-width="2"/><path d="M20 31q16-10 32 0v10q-16-7-32 0z" fill="#f2bf5b"/><circle cx="29" cy="36" r="2" fill="#180c14"/><circle cx="43" cy="36" r="2" fill="#180c14"/><path d="M29 46q7 5 14 0" fill="none" stroke="#f2bf5b" stroke-width="2" stroke-linecap="round"/><path d="M20 53l-5 7m37-7 5 7" stroke="#ff5ca8" stroke-width="4" stroke-linecap="round"/></svg></div><div><span class="tag goldtag">NINJA DA CONSTÂNCIA · ${mode.toUpperCase()}</span><p>${msg}</p><div class="fine">Olha os últimos 3 dias; um dia ruim não apaga seu caminho.</div></div></div>`}function home(){let x=day(),goal=+db.settings.goal||200,g=totalIncome(x),expense=totalExpense(x),liquid=net(x),rDone=Object.values(x.routine).filter(Boolean).length;return `${title('Hoje',new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'}))}<div class="card homehero"><div class="stat">SALDO LÍQUIDO DE HOJE</div><div class="big ${liquid>=0?'gold':'red'}">${money(liquid)}</div><div class="home-summary"><span>Entradas <b class="teal">${money(g)}</b></span><span>Saídas <b class="red">${money(expense)}</b></span></div><div class="row section"><span class="stat">META DO DIA</span><label class="goal-input"><span>R$</span><input aria-label="Meta diária" type="number" min="0" step="10" data-goal value="${goal}"></label></div><div class="progress"><i style="width:${Math.min(100,g/goal*100)}%"></i></div><div class="fine">${g>=goal?'Meta alcançada. Boa!':`Faltam ${money(goal-g)} para a meta que você definiu.`} É referência, não cobrança.</div></div><div class="section"><h2 class="section-title">Pra onde você quer ir?</h2><div class="home-links"><button class="home-link" data-nav="Trabalho"><b>🏍️ Trabalho e ganhos</b><span>Blocos, Uber/99, custos e resultado por hora</span></button><button class="home-link" data-nav="Dinheiro"><b>💸 Lançar entrada ou gasto</b><span>Categoria, sinal e valor em poucos toques</span></button><button class="home-link" data-nav="Rotina"><b>✓ Rotina de hoje</b><span>${rDone} itens feitos · modo dia difícil disponível</span></button><button class="home-link" data-nav="Semana"><b>▦ Minha semana</b><span>Ganhos, custos, líquido e descanso</span></button><button class="home-link" data-nav="Pagamentos"><b>◷ Pagamentos</b><span>Contas cadastradas e situação</span></button><button class="home-link" data-nav="Calendário"><b>▤ Calendário</b><span>Operações, datas e prazos</span></button></div></div><div class="card section next-step"><div><span class="tag goldtag">PRÓXIMO PASSO</span><p>${db.settings.mission?esc(db.settings.mission):'Escolha uma ação pequena. Não precisa planejar o dia inteiro.'}</p></div><div class="row wrap"><button class="btn small secondary" data-action="mission">${db.settings.mission?'Trocar missão':'Definir missão'}</button><button class="btn small secondary" data-nav="Projetos">Abrir projetos</button></div></div><div class="ninja-compact section">${ninja()}</div>`}function lastDaysMini(){let html=[];for(let i=6;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);let k=iso(d),x=db.days[k];html.push(`<div class="mini-day"><span>${d.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit'})}</span><b class="${x&&net(x)<0?'red':'teal'}">${x?money(net(x)):'—'}</b></div>`)}return `<div class="mini-days">${html.join('')}</div>`}function routinePage(){let x=day();return `${title('Rotina','Sem horário rígido. Comece pela hora em que acordou.')}<div class="row"><div><span class="tag">${Object.values(x.routine).filter(Boolean).length}/9 feitas</span></div><button class="btn small secondary" data-action="tough">${x.tough?'Mostrar rotina normal':'Dia difícil'}</button></div><div class="card section"><h2>${x.tough?'Essencial para hoje':'Checklist do dia'}</h2>${routine.filter(a=>!x.tough||essentials.includes(a[0])).map(([id,n,tag])=>`<div class="item"><input class="check" type="checkbox" data-routine="${id}" ${x.routine[id]?'checked':''}><label>${n}<small>${essentials.includes(id)?'Essencial':'Se der, sem obrigação'}</small></label></div>`).join('')}</div><div class="warning section">No modo dia difícil, cumprir o básico já é suficiente. Você não perde sequência nem recebe punição.</div>`}function healthPage(){let h=day().health;let tasks=[['pause','Fiz uma pausa'],['food','Comi algo que me sustentou'],['hygiene','Cuidei da higiene'],['helmet','Capacete e equipamento conferidos'],['rest','Respeitei meu cansaço']];return `${title('Saúde e energia','Acompanhar sem diagnóstico e sem metas rígidas. Ajuste ao que funciona para você.')}<div class="grid g2"><div class="card"><h2>Água</h2><div class="row"><button class="btn secondary" data-action="waterminus">−</button><div class="big teal">${h.water} <span class="subtle">copos registrados</span></div><button class="btn tealbtn" data-action="waterplus">+ 1 copo</button></div><p class="fine">Sem meta universal: siga sua sede, rotina e orientações profissionais.</p></div><div class="card"><h2>Sono</h2><label class="field"><span>Como foi o descanso?</span><select data-health="sleep"><option value="">Escolher</option>${['Reparador','Razoável','Ruim'].map(v=>`<option ${h.sleep===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="field section"><span>Energia hoje</span><select data-health="energy"><option value="">Escolher</option>${['Baixa','Média','Boa'].map(v=>`<option ${h.energy===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="field section"><span>Humor (opcional)</span><select data-health="mood"><option value="">Não marcar</option>${['Baixo','Neutro','Bom'].map(v=>`<option ${h.mood===v?'selected':''}>${v}</option>`).join('')}</select></label></div></div><div class="card section"><h2>Cuidados rápidos</h2>${tasks.map(([id,n])=>`<div class="item"><input class="check" type="checkbox" data-healthcheck="${id}" ${h.checks[id]?'checked':''}><label>${n}</label></div>`).join('')}</div><p class="fine section">Este app não diagnostica. Se o desânimo persistir ou estiver atrapalhando sua vida, buscar uma avaliação profissional é um cuidado válido, sem julgamento.</p>`}function workPage(){let x=day(),w=x.work;return `${title('Trabalho','Registre o que aconteceu; priorize pilotagem segura e descanso.')}<div class="card section"><div class="row wrap"><div><h2>Ganhos rápidos por bloco</h2><p class="fine">Cada toque marca R$ 50 estimados. Não representa hora pilotada.</p></div><span class="tag goldtag">${day().hours.length} × R$ 50</span></div><div class="quickHours">${Array.from({length:24},(_,i)=>`<button class="hour ${day().hours.includes(i)?'on':''}" data-action="hour" data-hour="${i}">${String(i).padStart(2,'0')}h ${day().hours.includes(i)?'✓':'＋'}</button>`).join('')}</div></div><div class="card"><h2>Ganhos de hoje</h2><div class="formgrid"><label class="field"><span>Uber (R$)</span><input type="number" min="0" step="0.01" data-work="uber" value="${w.uber||''}" placeholder="0"></label><label class="field"><span>99 (R$)</span><input type="number" min="0" step="0.01" data-work="ninenine" value="${w.ninenine||''}" placeholder="0"></label><label class="field"><span>Início (opcional)</span><input type="time" data-work="start" value="${w.start||''}"></label><label class="field"><span>Término (opcional)</span><input type="time" data-work="end" value="${w.end||''}"></label><label class="field"><span>Combustível (R$)</span><input type="number" min="0" step="0.01" data-work="fuel" value="${w.fuel||''}" placeholder="0"></label><label class="field"><span>Alimentação no trabalho (R$)</span><input type="number" min="0" step="0.01" data-work="food" value="${w.food||''}" placeholder="0"></label><label class="field"><span>Outros custos (R$)</span><input type="number" min="0" step="0.01" data-work="other" value="${w.other||''}" placeholder="0"></label></div><div class="sep"></div><div class="grid g3"><div><small class="stat">BRUTO</small><div class="gold"><b>${money(baseIncome(x))}</b></div></div><div><small class="stat">CUSTOS</small><div>${money((+w.fuel||0)+(+w.food||0)+(+w.other||0)+transactions(x).reduce((s,t)=>s+(t.amount<0?Math.abs(t.amount):0),0))}</div></div><div><small class="stat">LÍQUIDO</small><div class="teal"><b>${money(net(x))}</b></div></div></div><p class="fine">${totalHours(x)?`${totalHours(x).toFixed(1)} h · ${money(((+w.uber||0)+(+w.ninenine||0))/totalHours(x))}/h bruto aproximado`:'Informe início e término para calcular uma média aproximada.'}</p></div><div class="card section"><h2>Meta gradual</h2><p>Meta diária configurável, sem exigir jornada longa.</p><label class="field"><span>Meta em R$</span><input type="number" min="0" step="10" data-goal value="${db.settings.goal||200}"></label><div class="progress"><i style="width:${Math.min(100,totalIncome(x)/(+db.settings.goal||200)*100)}%"></i></div><div class="row"><span class="fine">Registrado ${money(totalIncome(x))} de ${money(db.settings.goal||200)}</span><button class="btn small secondary" data-action="weektarget">Ajustar meta semanal</button></div><p class="fine">A meta é uma referência ajustável, não uma cobrança. Pare e descanse se estiver cansado.</p><div class="row wrap"><button class="btn small secondary" data-action="workpreset" data-platform="Uber">＋ Uber</button><button class="btn small secondary" data-action="workpreset" data-platform="99">＋ 99</button><button class="btn small secondary" data-action="workpreset" data-platform="fuel">− Combustível</button><button class="btn small secondary" data-action="workpreset" data-platform="food">− Alimentação</button></div><div class="subtle">Meta semanal atual: ${money(db.settings.weekGoal||1000)} · registrado nos últimos 7 dias: ${money(last7income())}</div></div>`}function last7income(){let s=0;for(let i=0;i<7;i++){let d=new Date();d.setDate(d.getDate()-i);let x=db.days[iso(d)];if(x)s+=totalIncome(x)}return s}function nextPayment(){let p=db.payments.filter(p=>p.status!=='Pago'&&p.due).sort((a,b)=>a.due.localeCompare(b.due));return p[0]?`<b>${esc(p[0].name)}</b><div class="subtle">${p[0].amount?money(p[0].amount):'Valor não informado'} · ${new Date(p[0].due+'T12:00:00').toLocaleDateString('pt-BR')}</div>`:'<p class="subtle">Nenhum pagamento futuro cadastrado.</p>'}function moneyPage(){let x=day();let p=db.payments.filter(a=>a.status!=='Pago').sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));return `${title('Dinheiro','Veja o resultado e registre com poucos toques.')}<div class="card section"><h2>Novo lançamento</h2><form id="transactionForm" class="formgrid"><label class="field"><span>Tipo</span><select name="sign" id="txSign"><option value="1">＋ Entrada</option><option value="-1">− Saída</option></select></label><label class="field"><span>Categoria</span><select name="category" id="txCategory"><option>Corrida</option><option>Combustível</option><option>Alimentação</option><option>Manutenção da moto</option><option>Conta</option><option>Outro</option></select></label><label class="field wide"><span>Valor (R$)</span><input name="amount" id="txAmount" type="number" min="0.01" step="0.01" required placeholder="Toque num valor rápido"></label><div class="row wrap quick-amounts wide">${[10,20,50,100].map(n=>`<button class="btn small secondary" type="button" data-quickamount="${n}">R$ ${n}</button>`).join('')}</div><div class="wide"><button class="btn" type="submit">Adicionar ao dia</button></div></form></div><div class="grid g2"><div class="card"><small class="stat">ENTRADAS DE HOJE</small><div class="big gold">${money(totalIncome(x))}</div></div><div class="card"><small class="stat">SAÍDAS REGISTRADAS</small><div class="big">${money(totalExpense(x))}</div></div></div><div class="card section"><div class="row"><div><small class="stat">LÍQUIDO REGISTRADO</small><div class="big ${net(x)>=0?'teal':'red'}">${money(net(x))}</div></div><span class="fine">não inclui valores ainda não anotados</span></div><p>Antes de usar o saldo, considere separar o necessário para <b>combustível, alimentação e moto</b>.</p><button class="btn secondary small" data-nav="Trabalho">Registrar ganhos e custos</button></div><div class="card section"><div class="row"><h2>Pagamentos próximos</h2><button class="btn small" data-nav="Pagamentos">+ Cadastrar</button></div>${p.length?p.slice(0,4).map(pay=>`<div class="item"><div><b>${esc(pay.name)}</b><small>${pay.due?new Date(pay.due+'T12:00:00').toLocaleDateString('pt-BR'):'Sem vencimento'} · ${esc(pay.category||'Conta')}${pay.projectId?' · '+esc(db.projects.find(a=>a.id===pay.projectId)?.name||'Projeto'):''}</small></div><strong class="gold">${pay.amount?money(pay.amount):'—'}</strong><button class="btn small secondary" data-action="payevent" data-id="${pay.id}">Agenda</button></div>`).join(''):'<p class="subtle">Ainda sem pagamentos cadastrados. Não preenchemos valores nem prazos por você.</p>'}</div><div class="card section"><h2>Lançamentos de hoje</h2>${transactions(x).length?transactions(x).slice().reverse().map(t=>`<div class="item"><div><b>${esc(t.label)}</b><small>${new Date(t.created).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</small></div><strong class="${t.amount>0?'teal':'red'}">${t.amount>0?'+':''}${money(t.amount)}</strong><button class="btn small danger" data-action="transactiondelete" data-id="${t.id}">×</button></div>`).join(''):'<p class="subtle">Nenhum lançamento manual hoje.</p>'}</div><div class="card section"><h2>Gastos de hoje</h2>${Object.entries(x.expenses||{}).length?Object.entries(x.expenses).map(([eid,item])=>`<div class="item"><div><b>${esc(item.name)}</b><small>Registrado hoje</small></div><strong>${money(item.amount)}</strong><button class="btn small danger" data-action="expensedelete" data-id="${eid}">×</button></div>`).join(''):'<p class="subtle">Nenhum gasto rápido registrado hoje.</p>'}</div><div class="card section"><h2>Lançamento rápido</h2><form id="transactionForm" class="formgrid"><label class="field"><span>Tipo</span><select name="sign"><option value="1">＋ Entrada</option><option value="-1">− Saída</option></select></label><label class="field"><span>Categoria</span><select name="category"><option>Corrida</option><option>Combustível</option><option>Alimentação</option><option>Manutenção da moto</option><option>Conta</option><option>Outro</option></select></label><label class="field wide"><span>Valor (R$)</span><input name="amount" type="number" min="0.01" step="0.01" required placeholder="Toque num valor rápido"></label><div class="row wrap quick-amounts wide">${[10,20,50,100].map(n=>`<button class="btn small secondary" type="button" data-quickamount="${n}">R$ ${n}</button>`).join('')}</div><div class="wide"><button class="btn" type="submit">Adicionar ao dia</button></div></form></div>`}function projectsPage(){let arr=db.projects;return `${title('Projetos e planos','Todo projeto precisa de uma próxima ação pequena para ser retomado.')}<div class="card"><h2>Novo projeto</h2><form id="projectForm" class="formgrid"><label class="field wide"><span>Nome do projeto *</span><input name="name" required placeholder="Ex.: organizar mudança"></label><label class="field wide"><span>Por que importa? *</span><textarea name="why" required placeholder="Uma frase curta"></textarea></label><label class="field wide"><span>Resultado esperado *</span><input name="outcome" required placeholder="Como vou saber que terminou?"></label><label class="field wide"><span>Próxima ação concreta *</span><input name="next" required placeholder="Ação de até 30 minutos"></label><label class="field"><span>Prazo (se houver)</span><input name="due" type="date"></label><label class="field"><span>Prioridade</span><select name="priority"><option>Normal</option><option>Alta</option><option>Baixa</option></select></label><div class="wide">${actionButton('Salvar projeto','saveproject','')}</div></form></div><div class="section list">${arr.length?arr.map(p=>`<div class="listcard"><div class="row"><h3>${esc(p.name)}</h3><span class="tag ${p.priority==='Alta'?'goldtag':''}">${esc(p.status||'Em andamento')}</span></div><p><b>Importa:</b> ${esc(p.why)}</p><p><b>Resultado:</b> ${esc(p.outcome)}</p><p><b>Próximo passo:</b> ${esc(p.next)}</p><div class="row wrap"><span class="fine">${p.due?'Prazo '+new Date(p.due+'T12:00:00').toLocaleDateString('pt-BR'):'Sem prazo definido'} · ${db.payments.filter(x=>x.projectId===p.id&&x.status!=='Pago').length} pagamento(s) relacionado(s)</span><div class="row"><button class="btn small secondary" data-action="projectevent" data-id="${p.id}">Agendar</button><button class="btn small secondary" data-action="projectdone" data-id="${p.id}">${p.status==='Concluído'?'Reabrir':'Concluir'}</button><button class="btn small danger" data-action="projectdelete" data-id="${p.id}">Excluir</button></div></div></div>`).join(''):'<div class="empty">Nenhum projeto ainda. Cadastre um só quando tiver uma próxima ação clara.</div>'}</div>`}function paymentsPage(){return `${title('Pagamentos futuros','Atalhos para preencher rápido; se não souber valor ou data, deixe em branco.')}<div class="card"><h2>Novo pagamento</h2><div class="row wrap payment-presets">${['Combustível','Alimentação','Moto','Moradia','Dívida'].map(v=>`<button class="btn small secondary" type="button" data-paymentpreset="${v}">${v}</button>`).join('')}</div><form id="paymentForm" class="formgrid"><label class="field"><span>Conta / pagamento</span><input name="name" id="paymentName" placeholder="Opcional: escolha um atalho acima"></label><label class="field"><span>Valor (R$), se souber</span><input name="amount" type="number" step="0.01" min="0" placeholder="Não obrigatório"></label><label class="field"><span>Vencimento</span><input name="due" type="date"></label><label class="field"><span>Categoria</span><select name="category"><option>Essencial</option><option>Moto / trabalho</option><option>Moradia</option><option>Dívida</option><option>Outro</option></select></label><label class="field wide"><span>Projeto relacionado (opcional)</span><select name="projectId"><option value="">Sem projeto vinculado</option>${db.projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></label><div class="wide">${actionButton('Salvar pagamento','savepayment','')}</div></form></div><div class="section list">${db.payments.length?db.payments.slice().sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')).map(p=>`<div class="listcard"><div class="row"><h3>${esc(p.name)}</h3><strong class="gold">${p.amount?money(p.amount):'Valor não informado'}</strong></div><p>${esc(p.category||'Conta')} · ${p.due?'Vence '+new Date(p.due+'T12:00:00').toLocaleDateString('pt-BR'):'Sem vencimento definido'}</p><p>${p.projectId?'Projeto: '+esc(db.projects.find(a=>a.id===p.projectId)?.name||'projeto removido'):'Sem projeto relacionado'}</p><div class="row wrap"><select data-paystatus="${p.id}"><option ${p.status==='Pendente'?'selected':''}>Pendente</option><option ${p.status==='Pago'?'selected':''}>Pago</option><option ${p.status==='Adiado'?'selected':''}>Adiado</option></select><button class="btn small secondary" data-action="payevent" data-id="${p.id}">Vincular à data</button><button class="btn small danger" data-action="paydelete" data-id="${p.id}">Excluir</button></div></div>`).join(''):'<div class="empty">Nenhum pagamento cadastrado ainda.</div>'}</div>`}function calendarPage(){let y=calMonth.getFullYear(),m=calMonth.getMonth(),first=new Date(y,m,1),start=(first.getDay()+6)%7,daysIn=new Date(y,m+1,0).getDate(),prevDays=new Date(y,m,0).getDate();let cells=[];for(let i=0;i<42;i++){let n=i-start+1,dt=new Date(y,m,n),d=iso(dt),inMonth=n>=1&&n<=daysIn;cells.push({d,label:inMonth?n:n<1?prevDays+n:n-daysIn,inMonth})}let events=db.events.filter(e=>e.date===calDate),due=db.payments.filter(p=>p.due===calDate),projectDue=db.projects.filter(p=>p.due===calDate&&p.status!=='Concluído');return `${title('Calendário','Dias específicos para operações, compromissos e vencimentos.')}<div class="card"><div class="calendarHead"><button class="btn small secondary" data-action="calprev">‹</button><b>${calMonth.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</b><button class="btn small secondary" data-action="calnext">›</button></div><div class="calgrid">${['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(x=>`<div class="dow">${x}</div>`).join('')}${cells.map(c=>`<button class="daycell ${c.inMonth?'':'muted'} ${c.d===calDate?'sel':''} ${c.d===today()?'today':''} ${db.events.some(e=>e.date===c.d)||db.payments.some(p=>p.due===c.d&&p.status!=='Pago')||db.projects.some(p=>p.due===c.d&&p.status!=='Concluído')?'has':''}" data-action="calday" data-date="${c.d}">${c.label}</button>`).join('')}</div></div><div class="card section"><div class="row"><h2>${new Date(calDate+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}</h2><button class="btn small" data-action="addevent">+ Operação / evento</button></div>${events.length||due.length||projectDue.length?[...projectDue.map(p=>`<div class="item eventline"><div><b>Prazo do projeto: ${esc(p.name)}</b><small>Próxima ação: ${esc(p.next)}</small></div><button class="btn small secondary" data-nav="Projetos">Abrir</button></div>`),...events.map(e=>`<div class="item eventline"><div><b>${esc(e.title)}</b><small>${e.time?e.time+' · ':''}${esc(e.type||'Evento')}${e.projectId?' · '+esc(db.projects.find(p=>p.id===e.projectId)?.name||'Projeto'):''}</small>${e.notes?`<small>${esc(e.notes)}</small>`:''}</div><button class="btn small danger" data-action="eventdelete" data-id="${e.id}">×</button></div>`),...due.map(p=>`<div class="item eventline"><div><b>Pagamento: ${esc(p.name)}</b><small>${p.amount?money(p.amount):'Valor não informado'} · ${esc(p.status||'Pendente')}</small></div><button class="btn small secondary" data-nav="Pagamentos">Abrir</button></div>`)].join(''):'<p class="subtle">Nada agendado para esse dia.</p>'}</div>`}function eventModal(prefill={}){let projectOpts=db.projects.map(p=>`<option value="${p.id}" ${prefill.projectId===p.id?'selected':''}>${esc(p.name)}</option>`).join('');document.getElementById('sheet').innerHTML=`<div class="sheethead"><h2>Agendar operação ou evento</h2><button class="iconbtn" data-action="close">✕</button></div><form id="eventForm" class="formgrid"><label class="field wide"><span>O que vai acontecer? *</span><input name="title" required value="${esc(prefill.title||'')}" placeholder="Ex.: trabalhar, buscar documento"></label><label class="field"><span>Data *</span><input type="date" name="date" required value="${prefill.date||calDate}"></label><label class="field"><span>Horário (opcional)</span><input type="time" name="time"></label><label class="field"><span>Tipo</span><select name="type">${['Operação','Compromisso','Etapa de projeto','Pessoal','Pagamento'].map(v=>`<option ${prefill.type===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="field"><span>Projeto relacionado</span><select name="projectId"><option value="">Sem projeto</option>${projectOpts}</select></label><label class="field wide"><span>Nota curta (opcional)</span><input name="notes" placeholder="Detalhe útil para lembrar"></label><div class="wide"><button class="btn" type="submit">Salvar no calendário</button></div></form>`;document.getElementById('overlay').classList.add('show')}function feedPage(){return `${title('Feed','Anotações curtas que permanecem salvas. Pode ser só uma frase.')}<div class="card"><form id="feedForm"><label class="field"><span>O que vale registrar?</span><textarea name="text" id="feedText" placeholder="Escreva uma nota curta ou escolha um toque abaixo"></textarea></label><div class="row wrap section">${['😊','😐','😔','💪','💰','🏍️','🙏','😴'].map(e=>`<button type="button" class="btn small secondary" data-emoji="${e}">${e}</button>`).join('')}<button class="btn" type="submit">Postar</button></div></form></div><div class="list section">${db.feed.length?db.feed.slice().reverse().map(f=>`<div class="listcard"><div class="row"><span class="fine">${new Date(f.created).toLocaleString('pt-BR')}</span><button class="btn small danger" data-action="feeddelete" data-id="${f.id}">Apagar</button></div><p>${esc(f.text)}</p></div>`).join(''):'<div class="empty">Seu feed está vazio. Use para registrar um detalhe importante, sem obrigação diária.</div>'}</div>`}function weekPage(){let rows=[];for(let i=6;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);let k=iso(d),x=db.days[k];rows.push({k,x})}let worked=rows.filter(({x})=>x&&totalIncome(x)>0).length;let gross=rows.reduce((s,a)=>s+(a.x?totalIncome(a.x):0),0),cost=rows.reduce((s,a)=>s+(a.x?totalExpense(a.x):0),0),daysRest=rows.filter(({x})=>x&&x.health?.sleep).length,rested=rows.filter(({x})=>x&&['Reparador','Razoável'].includes(x.health?.sleep)).length;return `${title('Semana','Ganhos, custos e descanso — sem preencher relatório.')}<div class="grid g2"><div class="card"><small class="stat">DIAS COM TRABALHO REGISTRADO</small><div class="big gold">${worked}/7</div></div><div class="card"><small class="stat">GANHO BRUTO REGISTRADO</small><div class="big">${money(gross)}</div></div><div class="card"><small class="stat">CUSTOS REGISTRADOS</small><div class="big red">${money(cost)}</div></div><div class="card"><small class="stat">LÍQUIDO ANOTADO</small><div class="big teal">${money(gross-cost)}</div></div><div class="card"><small class="stat">SONO REPARADOR / RAZOÁVEL</small><div class="big">${rested}/${daysRest}</div><p class="fine">entre os dias com qualidade do sono registrada</p></div></div><div class="card section"><h2>Últimos 7 dias</h2>${rows.map(({k,x})=>`<div class="item"><div><b>${new Date(k+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'})}</b><small>${x?`Bruto ${money(totalIncome(x))} · custos ${money(totalExpense(x))} · ${totalIncome(x)>0?'trabalho registrado · ':''}sono ${esc(x.health?.sleep||'—')}`:'Sem registro'}</small></div><span>${x?money(net(x)):'—'}</span></div>`).join('')}</div><div class="card section"><h2>Revisão em dois toques</h2><div class="formgrid"><label class="field"><span>Como foi?</span><select data-week="mood"><option value="">Escolher</option>${['Boa','Normal','Pesada'].map(v=>`<option ${db.week?.mood===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="field"><span>Prioridade da próxima semana</span><select data-week="priority"><option value="">Escolher</option>${['Trabalho','Contas','Descanso','Moto','Casa','Saúde','Projeto'].map(v=>`<option ${db.week?.priority===v?'selected':''}>${v}</option>`).join('')}</select></label></div><label class="field section"><span>Pendente (opcional)</span><input data-week="pending" value="${esc(db.week?.pending||'')}" placeholder="Pode deixar em branco"></label></div>`}function dataPage(){return `${title('Dados e segurança','Seus registros ficam neste navegador e aparelho. Faça backup regularmente.')}<div class="card"><h2>Backup</h2><p>Baixe uma cópia JSON. Para restaurar, escolha um arquivo exportado anteriormente. A importação substitui os dados atuais deste app.</p><div class="row wrap"><button class="btn" data-action="backup">Baixar backup</button><label class="btn secondary">Restaurar backup<input type="file" accept="application/json,.json" id="restoreFile" class="hidden"></label></div><p class="fine">Não sincroniza automaticamente entre navegadores ou aparelhos. Guarde o backup em local seguro.</p></div><div class="card section"><h2>Privacidade e limites</h2><p>O app salva no armazenamento local do navegador. Não há conta, servidor de sincronização nem envio automático dos seus dados.</p><p>Valores financeiros são registros manuais, não extratos bancários. Confirme antes de tomar decisões de pagamento.</p><button class="btn danger section" data-action="reset">Apagar todos os dados deste aparelho</button></div>`}function moreMenu(){let pages=[['Saúde','♥','Água, energia e autocuidado'],['Trabalho','↗','Ganhos, custos e jornada'],['Projetos','◇','Planos com próxima ação'],['Pagamentos','◷','Contas e vencimentos'],['Semana','▦','Resumo e revisão'],['Feed','✎','Notas que não somem'],['Dados','↧','Backup e restauração']];document.getElementById('sheet').innerHTML=`<div class="sheethead"><h2>Star of Chaos</h2><button class="iconbtn" data-action="close">✕</button></div><div class="menu-grid">${pages.map(([n,i,d])=>`<button class="menu-card" data-nav="${n}"><span>${i}</span><strong>${n}</strong><small class="subtle">${d}</small></button>`).join('')}</div>`;document.getElementById('overlay').classList.add('show')}function render(){nav();let html=page==='Hoje'?home():page==='Rotina'?routinePage():page==='Saúde'?healthPage():page==='Trabalho'?workPage():page==='Dinheiro'?moneyPage():page==='Projetos'?projectsPage():page==='Pagamentos'?paymentsPage():page==='Calendário'?calendarPage():page==='Semana'?weekPage():page==='Feed'?feedPage():dataPage();document.getElementById('app').innerHTML=header()+html;save()}function go(p){if(p==='Mais'){moreMenu();return}page=p;document.getElementById('overlay').classList.remove('show');render();window.scrollTo(0,0)}function downloadBackup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`central-da-vida-backup-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Backup baixado')}function id(){return crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()}document.addEventListener('click',e=>{let preset=e.target.closest('[data-paymentpreset]');if(preset){let field=document.getElementById('paymentName');if(field){field.value=preset.dataset.paymentpreset}let cat=document.querySelector('#paymentForm [name=category]');if(cat){const map={'Combustível':'Moto / trabalho','Alimentação':'Essencial','Moto':'Moto / trabalho','Moradia':'Moradia','Dívida':'Dívida'};cat.value=map[preset.dataset.paymentpreset]||'Outro'}return}let q=e.target.closest('[data-quickamount]');if(q){let amt=document.getElementById('txAmount');if(amt){amt.value=q.dataset.quickamount;amt.focus()}return}let n=e.target.closest('[data-nav]');if(n){go(n.dataset.nav);return}let em=e.target.closest('[data-emoji]');if(em){let t=document.getElementById('feedText');if(t){t.value+=em.dataset.emoji+' ';t.focus()}return}let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action,x=day();if(a==='workpreset'){page='Dinheiro';render();let sign=document.getElementById('txSign'),cat=document.getElementById('txCategory'),amount=document.getElementById('txAmount'),platform=b.dataset.platform;if(sign)sign.value=['fuel','food'].includes(platform)?'-1':'1';if(cat)cat.value=platform==='fuel'?'Combustível':platform==='food'?'Alimentação':platform==='Uber'||platform==='99'?'Corrida':'Outro';if(amount)amount.focus();return}else if(a==='hour'){let h=+b.dataset.hour;x.hours=x.hours.includes(h)?x.hours.filter(v=>v!==h):[...x.hours,h];if(x.hours.includes(h))addXP();render()}else if(a==='waterplus'){x.health.water++;addXP();render()}else if(a==='waterminus'){x.health.water=Math.max(0,x.health.water-1);render()}else if(a==='tough'){x.tough=!x.tough;save();render()}else if(a==='calprev'){calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()-1,1);render()}else if(a==='calnext'){calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+1,1);render()}else if(a==='calday'){calDate=b.dataset.date;render()}else if(a==='addevent'){eventModal({date:calDate})}else if(a==='close'){document.getElementById('overlay').classList.remove('show')}else if(a==='backup'){downloadBackup()}else if(a==='mission'){let m=prompt('Qual é a missão principal de hoje? Uma ação concreta:');if(m!==null){db.settings.mission=m.trim();save();render()}}else if(a==='addexpense'){let name=document.getElementById('quickExpenseName').value,amt=+document.getElementById('quickExpenseAmount').value;if(amt<=0){toast('Informe o valor');return}transactions(x).push({id:id(),label:name,category:name,amount:-Math.abs(amt),created:new Date().toISOString()});save();toast('Gasto registrado');render()}else if(a==='saveproject'){let f=document.getElementById('projectForm');if(!f.reportValidity())return;let v=Object.fromEntries(new FormData(f));db.projects.push({...v,id:id(),status:'Em andamento',created:Date.now()});save();toast('Projeto salvo');render()}else if(a==='projectdone'){let p=db.projects.find(p=>p.id===b.dataset.id);if(p){p.status=p.status==='Concluído'?'Em andamento':'Concluído';save();render()}}else if(a==='projectdelete'){if(confirm('Excluir este projeto? Pagamentos e eventos não serão apagados.')){db.projects=db.projects.filter(p=>p.id!==b.dataset.id);save();render()}}else if(a==='projectevent'){let p=db.projects.find(p=>p.id===b.dataset.id);eventModal({date:p?.due||calDate,projectId:p?.id})}else if(a==='savepayment'){let f=document.getElementById('paymentForm');let v=Object.fromEntries(new FormData(f));v.name=(v.name||'').trim()||v.category||'Pagamento';db.payments.push({...v,amount:+v.amount||0,id:id(),status:'Pendente'});save();toast('Pagamento salvo');render()}else if(a==='paydelete'){if(confirm('Excluir este pagamento?')){db.payments=db.payments.filter(p=>p.id!==b.dataset.id);save();render()}}else if(a==='payevent'){let p=db.payments.find(p=>p.id===b.dataset.id);calDate=p?.due||today();calMonth=new Date(calDate+'T12:00:00');page='Calendário';render();if(!p?.due)setTimeout(()=>eventModal({date:calDate,title:`Pagamento: ${p.name}`,type:'Pagamento',projectId:p.projectId}),0)}else if(a==='eventdelete'){db.events=db.events.filter(v=>v.id!==b.dataset.id);save();render()}else if(a==='transactiondelete'){if(confirm('Apagar este lançamento do dia?')){x.transactions=transactions(x).filter(t=>t.id!==b.dataset.id);save();render()}}else if(a==='expensedelete'){if(confirm('Apagar este gasto do registro de hoje?')){delete x.expenses?.[b.dataset.id];save();render()}}else if(a==='feeddelete'){if(confirm('Apagar esta anotação?')){db.feed=db.feed.filter(v=>v.id!==b.dataset.id);save();render()}}else if(a==='weektarget'){let n=prompt('Meta semanal em reais (deixe um valor que seja realista para você):',db.settings.weekGoal||1000);if(n!==null&&+n>=0){db.settings.weekGoal=+n;save();render()}}else if(a==='reset'){if(confirm('Apagar TODOS os dados locais da Central da Vida? Esta ação não pode ser desfeita.')){localStorage.removeItem(KEY);location.reload()}}});document.addEventListener('change',e=>{let t=e.target,x=day();if(t.matches('[data-routine]')){x.routine[t.dataset.routine]=t.checked;if(t.checked)addXP();save();render()}else if(t.matches('[data-healthcheck]')){x.health.checks[t.dataset.healthcheck]=t.checked;if(t.checked)addXP();save();render()}else if(t.matches('[data-health]')){x.health[t.dataset.health]=t.value;if(t.value)addXP();save();render()}else if(t.matches('[data-work]')){x.work[t.dataset.work]=t.value;save();render()}else if(t.matches('[data-goal]')){db.settings.goal=Math.max(0,+t.value||0);save();render()}else if(t.matches('[data-paystatus]')){let p=db.payments.find(p=>p.id===t.dataset.paystatus);if(p){p.status=t.value;save();render()}}else if(t.matches('[data-week]')){db.week??={};db.week[t.dataset.week]=t.value;save()}else if(t.id==='restoreFile'&&t.files?.[0]){let fr=new FileReader();fr.onload=()=>{try{let d=JSON.parse(fr.result);if(!d||typeof d!=='object'||!d.days)throw Error();if(confirm('Restaurar este backup? Os dados atuais serão substituídos.')){localStorage.setItem(KEY,JSON.stringify(d));location.reload()}}catch{alert('Arquivo de backup inválido.')}};fr.readAsText(t.files[0])}});document.addEventListener('submit',e=>{e.preventDefault();let f=e.target;if(f.id==='transactionForm'){let values=Object.fromEntries(new FormData(f)),amount=Number(values.amount);if(!Number.isFinite(amount)||amount<=0){toast('Escolha um valor maior que zero');return}let x=day();let signedAmount=Math.abs(amount)*Number(values.sign||1),category=values.category||'Outro';transactions(x).push({id:id(),label:category,category,amount:signedAmount,created:new Date().toISOString()});save();toast(`${signedAmount>0?'Entrada':'Saída'} de ${money(Math.abs(signedAmount))} adicionada`);render()}else if(f.id==='eventForm'){let v=Object.fromEntries(new FormData(f));db.events.push({...v,id:id()});calDate=v.date;calMonth=new Date(v.date+'T12:00:00');save();document.getElementById('overlay').classList.remove('show');page='Calendário';toast('Agendado no calendário');render()}else if(f.id==='feedForm'){let v=new FormData(f).get('text').trim();if(!v)return;db.feed.push({id:id(),text:v,created:new Date().toISOString()});save();render()}});render();if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});})();
